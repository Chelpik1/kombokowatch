<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KombokoWatch — Liquid Glass</title>

  <!-- Google Fonts: Comfortaa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Symbols Font -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

  <style>
    :root {
      --glass-bg: rgba(18, 15, 28, 0.65);
      --glass-surface: rgba(32, 26, 48, 0.45);
      --glass-surface-high: rgba(50, 40, 75, 0.55);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-glow: rgba(208, 188, 255, 0.35);
      
      --color-primary: #D0BCFF;
      --color-on-primary: #381E72;
      --color-primary-container: #4F378B;
      --color-on-primary-container: #EADDFF;
      --color-surface: #E6E0E9;
      --color-variant: #CAC4D0;

      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-full: 9999px;
      --bottom-nav-height: 76px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Comfortaa', cursive, sans-serif;
    }

    /* Изолируем шрифт иконок */
    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      vertical-align: middle;
    }
    .material-symbols-rounded.filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    body {
      background-color: #08060f;
      color: var(--color-surface);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      position: relative;
    }

    /* Анимированные жидкие неоновые сферы на фоне */
    body::before, body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.35;
      animation: floatOrbs 12s ease-in-out infinite alternate;
    }
    body::before {
      top: -150px;
      left: -150px;
      background: rgba(115, 74, 186, 0.6);
    }
    body::after {
      bottom: -150px;
      right: -150px;
      background: rgba(85, 30, 130, 0.7);
      animation-delay: -6s;
    }

    @keyframes floatOrbs {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(40px) scale(1.1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Навигация */
    .nav-rail {
      width: 92px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      gap: 16px;
      box-shadow: 15px 0 40px rgba(0, 0, 0, 0.4);
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(208, 188, 255, 0.25);
      border: 1.5px solid var(--glass-border-glow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .brand-logo:hover { transform: scale(1.08); }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }

    .nav-items {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--color-variant);
      cursor: pointer;
      width: 100%;
      font-size: 11px;
      transition: color 0.2s;
    }

    .nav-pill {
      width: 60px;
      height: 36px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-item:hover { color: var(--color-surface); }
    .nav-item:hover .nav-pill { background: rgba(255, 255, 255, 0.05); }

    .nav-item.active { color: var(--color-primary); }
    .nav-item.active .nav-pill {
      background: rgba(208, 188, 255, 0.2);
      box-shadow: inset 0 0 0 1.5px rgba(208, 188, 255, 0.4), 0 4px 15px rgba(208, 188, 255, 0.2);
    }
    .nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; }

    /* Растягиваем контент на всю ширину экрана для ПК */
    .app-main {
      flex: 1;
      margin-left: 92px;
      padding: 24px 36px 56px;
      width: calc(100% - 92px);
    }

    .app-header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .brand-avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      object-fit: cover;
      box-shadow: 0 6px 20px rgba(208, 188, 255, 0.3);
      border: 1.5px solid var(--glass-border-glow);
    }

    .brand-title-text {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #D0BCFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 25px rgba(208, 188, 255, 0.25);
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .search-container {
      flex: 1;
      min-width: 280px;
      display: flex;
      align-items: center;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-full);
      padding: 6px 12px 6px 20px;
      height: 56px;
      gap: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-container:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 10px 40px rgba(208, 188, 255, 0.2), inset 0 0 0 1.5px rgba(208, 188, 255, 0.3);
      transform: translateY(-2px);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--color-surface);
      font-size: 15px;
    }
    .search-input::placeholder { color: var(--color-variant); opacity: 0.7; }

    .md-btn {
      height: 44px;
      padding: 0 24px;
      border-radius: var(--radius-full);
      border: none;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .md-btn:hover { transform: scale(1.04); }
    .md-btn:active { transform: scale(0.96); }

    .md-btn-filled {
      background: linear-gradient(135deg, #D0BCFF 0%, #b39ddb 100%);
      color: var(--color-on-primary);
      box-shadow: 0 6px 20px rgba(208, 188, 255, 0.35);
    }

    .md-btn-tonal {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--color-surface);
    }
    .md-btn-tonal:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--glass-border-glow); }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* Адаптивная сетка под всю ширину экрана */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    .anime-card {
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .anime-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--glass-border-glow);
      box-shadow: 0 16px 50px rgba(208, 188, 255, 0.2);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 2.85;
      background: rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .anime-card:hover .poster-wrap img { transform: scale(1.06); }

    .card-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-pill {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      background: rgba(12, 9, 20, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--color-surface);
    }
    .badge-pill.rating { color: #FFD54F; }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 12px;
      color: var(--color-variant);
      margin-top: auto;
    }

    .watch-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
      align-items: start;
    }

    .player-card {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
    }

    .video-stage {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    .video-stage iframe { width: 100%; height: 100%; border: none; display: block; }

    .player-toolbar {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 12, 22, 0.7);
      border-top: 1px solid var(--glass-border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .sidebar-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .voice-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 200px; overflow-y: auto; }
    .voice-chip {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      color: var(--color-surface);
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      transition: all 0.2s;
    }
    .voice-chip:hover { background: rgba(255, 255, 255, 0.08); }
    .voice-chip.active { background: rgba(208, 188, 255, 0.2); border-color: var(--glass-border-glow); color: var(--color-primary); box-shadow: 0 0 15px rgba(208, 188, 255, 0.2); }

    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; }
    .ep-btn {
      height: 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--color-surface);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ep-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
    .ep-btn.active { background: var(--color-primary); color: var(--color-on-primary); border-color: transparent; box-shadow: 0 0 20px rgba(208, 188, 255, 0.4); }

    .anime-details-box {
      margin-top: 20px;
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      gap: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.4);
    }
    .details-poster { width: 135px; border-radius: var(--radius-md); object-fit: cover; flex-shrink: 0; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }

    .loader-box {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      gap: 16px;
      color: var(--color-variant);
      text-align: center;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .nav-rail {
        top: auto; bottom: 0; left: 0; right: 0; width: 100%;
        height: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom));
        padding: 8px 12px env(safe-area-inset-bottom);
        flex-direction: row; justify-content: space-around;
        border-right: none; border-top: 1px solid var(--glass-border);
        box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.5);
      }
      .brand-logo { display: none; }
      .nav-items { flex-direction: row; justify-content: space-around; gap: 0; }
      .app-main { margin-left: 0; width: 100%; padding: 16px 14px calc(var(--bottom-nav-height) + 28px); }
      .anime-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 14px; }
      .watch-layout { grid-template-columns: 1fr; }
      .anime-details-box { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Навигация -->
  <nav class="nav-rail">
    <div class="brand-logo" onclick="switchTab('catalog')" title="KombokoWatch">
      <img src="logo.jpg" alt="Logo" onerror="this.src='https://shikimori.io/favicons/apple-touch-icon-180x180.png'" />
    </div>
    <div class="nav-items">
      <button class="nav-item active" id="nav-catalog" onclick="switchTab('catalog')">
        <div class="nav-pill"><span class="material-symbols-rounded">explore</span></div>
        <span>Каталог</span>
      </button>
      <button class="nav-item" id="nav-watch" onclick="switchTab('watch')">
        <div class="nav-pill"><span class="material-symbols-rounded">movie</span></div>
        <span>Плеер</span>
      </button>
      <button class="nav-item" id="nav-favorites" onclick="switchTab('favorites')">
        <div class="nav-pill"><span class="material-symbols-rounded">bookmark</span></div>
        <span>Закладки</span>
      </button>
      <button class="nav-item" id="nav-history" onclick="switchTab('history')">
        <div class="nav-pill"><span class="material-symbols-rounded">history</span></div>
        <span>История</span>
      </button>
    </div>
  </nav>

  <main class="app-main animate-fade">
    <div class="app-header-brand">
      <img src="logo.jpg" alt="Logo" class="brand-avatar" onerror="this.src='https://shikimori.io/favicons/apple-touch-icon-180x180.png'" />
      <h1 class="brand-title-text">KombokoWatch</h1>
    </div>

    <header class="top-bar">
      <form class="search-container" onsubmit="handleSearchSubmit(event)">
        <span class="material-symbols-rounded">search</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Название аниме или Shikimori ID..." />
        <button type="submit" class="md-btn md-btn-filled">Найти</button>
      </form>
    </header>

    <!-- Каталог -->
    <section id="view-catalog">
      <div class="section-header">
        <h2 class="section-title" id="sectionTitle">Каталог аниме</h2>
      </div>
      <div class="anime-grid" id="animeGrid">
        <div class="loader-box">
          <div class="spinner"></div>
          <span>Загрузка каталога с Shikimori...</span>
        </div>
      </div>
    </section>

    <!-- Плеер -->
    <section id="view-watch" style="display: none;">
      <div class="section-header">
        <button class="md-btn md-btn-tonal" onclick="switchTab('catalog')">
          <span class="material-symbols-rounded">arrow_back</span> Назад
        </button>
        <h2 class="section-title" id="watchTitle" style="flex:1; margin-left: 12px; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Тайтл</h2>
        <button class="md-btn md-btn-tonal" onclick="toggleCurrentFavorite()">
          <span class="material-symbols-rounded" id="favIcon">bookmark_add</span>
        </button>
      </div>

      <div class="watch-layout">
        <div>
          <div class="player-card">
            <div class="video-stage">
              <iframe id="kodikIframe" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
            </div>
            <div class="player-toolbar">
              <div style="display:flex; gap:8px; align-items:center;">
                <button class="md-btn md-btn-tonal" onclick="stepEpisode(-1)">Пред.</button>
                <span id="currentEpLabel" style="font-size: 14px; font-weight: 600;">Серия 1</span>
                <button class="md-btn md-btn-tonal" onclick="stepEpisode(1)">След.</button>
              </div>
              <a id="openInNewTab" class="md-btn md-btn-tonal" href="#" target="_blank">
                <span class="material-symbols-rounded" style="font-size:18px">open_in_new</span> Оригинал
              </a>
            </div>
          </div>

          <div class="anime-details-box">
            <img id="detailsPoster" class="details-poster" src="" alt="Poster" />
            <div style="display:flex; flex-direction:column; gap:8px;">
              <div id="detailsMeta" style="font-size:12px; color:var(--color-primary); font-weight: 600;"></div>
              <p id="detailsDesc" style="font-size:13px; line-height:1.5; color:var(--color-variant);"></p>
            </div>
          </div>
        </div>

        <aside class="sidebar-panel">
          <div>
            <div style="font-size:13px; font-weight:600; color:var(--color-variant); margin-bottom:10px;">Озвучка (<span id="voicesCount">0</span>)</div>
            <div class="voice-list" id="voiceList"></div>
          </div>
          <div>
            <div style="font-size:13px; font-weight:600; color:var(--color-variant); margin-bottom:10px;">Серии</div>
            <div class="episodes-grid" id="episodesGrid"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const KODIK_TOKEN = '447d179e875efe44217f20d1ee2146be';

    let state = {
      animes: [],
      currentAnimeFull: null,
      currentVariantIndex: 0,
      currentEpisodeNum: 1,
      favorites: JSON.parse(localStorage.getItem('kodik_favs') || '[]'),
      history: JSON.parse(localStorage.getItem('kodik_history') || '[]')
    };

    window.addEventListener('DOMContentLoaded', () => {
      fetchShikimoriCatalog();
    });

    async function fetchShikimoriCatalog(query = '') {
      const grid = document.getElementById('animeGrid');
      grid.innerHTML = `
        <div class="loader-box">
          <div class="spinner"></div>
          <span>Загружаем баннеры и описания...</span>
        </div>
      `;

      try {
        let url = 'https://shikimori.io/api/animes?limit=36&order=popularity';
        if (query) {
          if (/^\d+$/.test(query)) {
            url = `https://shikimori.io/api/animes/${query}`;
          } else {
            url = `https://shikimori.io/api/animes?search=${encodeURIComponent(query)}&limit=36`;
          }
        }

        const res = await fetch(url);
        const data = await res.json();
        const items = Array.isArray(data) ? data : [data];

        state.animes = items.filter(Boolean).map(item => {
          let poster = 'https://shikimori.io/favicons/apple-touch-icon-180x180.png';
          if (item.image) {
            const rawImg = item.image.original || item.image.preview || item.image.x96;
            if (rawImg) {
              poster = rawImg.startsWith('http') ? rawImg : `https://shikimori.io${rawImg}`;
            }
          }

          return {
            id: String(item.id),
            title: item.russian || item.name || 'Без названия',
            year: item.aired_on ? item.aired_on.slice(0, 4) : '2024',
            episodes: item.episodes || item.episodes_aired || 12,
            rating: item.score && item.score !== '0.0' ? item.score : null,
            poster,
            description: (item.description || 'Описание отсутствует.').replace(/\[.*?\]/g, ''),
            genres: (item.genres || []).map(g => g.russian),
            status: item.status === 'ongoing' ? 'Онгоинг' : 'Вышел'
          };
        });

        renderGrid(state.animes);
      } catch (err) {
        grid.innerHTML = `<p style="grid-column:1/-1; color:#F2B8B5; text-align:center;">Не удалось загрузить каталог с Shikimori.</p>`;
      }
    }

    function renderGrid(list) {
      const grid = document.getElementById('animeGrid');
      grid.innerHTML = '';

      if (!list || list.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--color-variant); text-align:center;">Ничего не найдено.</p>`;
        return;
      }

      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'anime-card animate-fade';
        card.onclick = () => loadKodikPlayerForAnime(item);

        card.innerHTML = `
          <div class="poster-wrap">
            <img src="${item.poster}" loading="lazy" onerror="this.src='https://shikimori.io/favicons/apple-touch-icon-180x180.png'" />
            <div class="card-badges">
              ${item.rating ? `<span class="badge-pill rating">★ ${item.rating}</span>` : `<span></span>`}
              <span class="badge-pill">${item.episodes} эп.</span>
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-title">${item.title}</h3>
            <div class="card-meta">${item.year}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function loadKodikPlayerForAnime(item) {
      switchTab('watch');
      
      document.getElementById('watchTitle').textContent = item.title;
      document.getElementById('detailsPoster').src = item.poster;
      document.getElementById('detailsMeta').textContent = 'Загрузка информации...';
      document.getElementById('detailsDesc').textContent = 'Загрузка полного описания...';

      let detailedItem = item;
      try {
        const detailRes = await fetch(`https://shikimori.io/api/animes/${item.id}`);
        const detailData = await detailRes.json();
        if (detailData && detailData.id) {
          let poster = item.poster;
          if (detailData.image) {
            const rawImg = detailData.image.original || detailData.image.preview;
            if (rawImg) poster = rawImg.startsWith('http') ? rawImg : `https://shikimori.io${rawImg}`;
          }
          detailedItem = {
            ...item,
            title: detailData.russian || detailData.name || item.title,
            poster,
            description: (detailData.description || 'Описание отсутствует.').replace(/\[.*?\]/g, ''),
            genres: (detailData.genres || []).map(g => g.russian),
            status: detailData.status === 'ongoing' ? 'Онгоинг' : 'Вышел',
            year: detailData.aired_on ? detailData.aired_on.slice(0, 4) : item.year
          };
        }
      } catch (_) {}

      document.getElementById('watchTitle').textContent = detailedItem.title;
      document.getElementById('detailsPoster').src = detailedItem.poster;
      document.getElementById('detailsMeta').textContent = [detailedItem.year, detailedItem.status, ...(detailedItem.genres || []).slice(0, 3)].filter(Boolean).join(' • ');
      document.getElementById('detailsDesc').textContent = detailedItem.description;

      const apiUrl = `https://kodikapi.com/search?token=${KODIK_TOKEN}&shikimori_id=${detailedItem.id}&with_episodes=true&with_material_data=true`;
      
      let kodikResults = [];
      try {
        const proxyRes = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`);
        const data = await proxyRes.json();
        if (data && data.results) kodikResults = data.results;
      } catch (_) {}

      state.currentAnimeFull = parseKodikVariants(detailedItem, kodikResults);
      state.currentVariantIndex = 0;
      state.currentEpisodeNum = 1;

      state.history = [detailedItem, ...state.history.filter(a => a.id !== detailedItem.id)].slice(0, 30);
      localStorage.setItem('kodik_history', JSON.stringify(state.history));

      renderVoiceChips();
      renderEpisodesGrid();
      loadCurrentEpisodeVideo();
    }

    function parseKodikVariants(baseItem, results) {
      const variants = [];
      for (const r of results) {
        const translation = r.translation || { id: 0, title: 'Оригинал', type: 'voice' };
        const episodes = {};
        if (r.seasons) {
          for (const sKey of Object.keys(r.seasons)) {
            const seasonObj = r.seasons[sKey];
            if (seasonObj && seasonObj.episodes) {
              for (const [epNum, epData] of Object.entries(seasonObj.episodes)) {
                episodes[epNum] = typeof epData === 'string' ? epData : epData.link;
              }
            }
          }
        }
        if (Object.keys(episodes).length === 0 && r.link) {
          episodes['1'] = r.link;
        }

        if (Object.keys(episodes).length > 0) {
          variants.push({
            translation,
            default_link: r.link,
            episodes
          });
        }
      }

      if (variants.length === 0) {
        const episodes = {};
        for (let i = 1; i <= (baseItem.episodes || 12); i++) {
          episodes[String(i)] = `https://kodik.info/find-player?shikimoriID=${baseItem.id}&episode=${i}`;
        }
        variants.push({
          translation: { id: 0, title: 'Основная озвучка Kodik', type: 'voice' },
          default_link: `https://kodik.info/find-player?shikimoriID=${baseItem.id}`,
          episodes
        });
      }

      return { ...baseItem, variants };
    }

    function renderVoiceChips() {
      const container = document.getElementById('voiceList');
      container.innerHTML = '';
      const variants = state.currentAnimeFull.variants;
      document.getElementById('voicesCount').textContent = variants.length;

      variants.forEach((v, idx) => {
        const btn = document.createElement('button');
        btn.className = `voice-chip ${idx === state.currentVariantIndex ? 'active' : ''}`;
        btn.textContent = v.translation.title;
        btn.onclick = () => {
          state.currentVariantIndex = idx;
          renderVoiceChips();
          renderEpisodesGrid();
          loadCurrentEpisodeVideo();
        };
        container.appendChild(btn);
      });
    }

    function renderEpisodesGrid() {
      const grid = document.getElementById('episodesGrid');
      grid.innerHTML = '';
      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      if (!variant) return;

      const epNumbers = Object.keys(variant.episodes).sort((a, b) => Number(a) - Number(b));
      
      epNumbers.forEach((epStr) => {
        const epNum = Number(epStr);
        const btn = document.createElement('button');
        btn.className = `ep-btn ${epNum === state.currentEpisodeNum ? 'active' : ''}`;
        btn.textContent = epNum;
        btn.onclick = () => {
          state.currentEpisodeNum = epNum;
          renderEpisodesGrid();
          loadCurrentEpisodeVideo();
        };
        grid.appendChild(btn);
      });
    }

    function loadCurrentEpisodeVideo() {
      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      if (!variant) return;

      const epNum = state.currentEpisodeNum;
      const rawLink = variant.episodes[String(epNum)] || variant.default_link;
      let cleanUrl = rawLink.startsWith('//') ? `https:${rawLink}` : rawLink;

      cleanUrl = cleanUrl
        .replace('kodik.info', 'kodikplayer.com')
        .replace('cloud.kodik-storage.com', 'cloud.kodikplayer.com');

      document.getElementById('currentEpLabel').textContent = `Серия ${epNum}`;
      document.getElementById('openInNewTab').href = cleanUrl;
      document.getElementById('kodikIframe').src = cleanUrl;
    }

    function stepEpisode(delta) {
      if (!state.currentAnimeFull) return;
      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      const target = state.currentEpisodeNum + delta;
      if (variant.episodes[String(target)]) {
        state.currentEpisodeNum = target;
        renderEpisodesGrid();
        loadCurrentEpisodeVideo();
      }
    }

    function handleSearchSubmit(e) {
      e.preventDefault();
      const raw = document.getElementById('searchInput').value.trim();
      if (!raw) {
        fetchShikimoriCatalog();
        return;
      }
      fetchShikimoriCatalog(raw);
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      const navBtn = document.getElementById(`nav-${tab}`);
      if (navBtn) navBtn.classList.add('active');

      const catalogView = document.getElementById('view-catalog');
      const watchView = document.getElementById('view-watch');

      if (tab === 'watch') {
        catalogView.style.display = 'none';
        watchView.style.display = 'block';
      } else {
        watchView.style.display = 'none';
        catalogView.style.display = 'block';
        if (tab === 'favorites') {
          document.getElementById('sectionTitle').textContent = 'Мои закладки';
          renderGrid(state.favorites);
        } else if (tab === 'history') {
          document.getElementById('sectionTitle').textContent = 'История просмотра';
          renderGrid(state.history);
        } else {
          document.getElementById('sectionTitle').textContent = 'Каталог аниме';
          renderGrid(state.animes);
        }
      }
    }

    function toggleCurrentFavorite() {
      if (!state.currentAnimeFull) return;
      const exists = state.favorites.some(a => a.id === state.currentAnimeFull.id);
      if (exists) {
        state.favorites = state.favorites.filter(a => a.id !== state.currentAnimeFull.id);
      } else {
        state.favorites.unshift(state.currentAnimeFull);
      }
      localStorage.setItem('kodik_favs', JSON.stringify(state.favorites));
      const icon = document.getElementById('favIcon');
      icon.textContent = exists ? 'bookmark_add' : 'bookmark_added';
    }
  </script>
</body>
</html>
