<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KombokoWatch — онлайн-кинотеатр</title>

  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

  <style>
    :root {
      --glass-bg: rgba(18, 15, 28, 0.65);
      --glass-surface: rgba(32, 26, 48, 0.45);
      --glass-surface-high: rgba(50, 40, 75, 0.55);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-glow: rgba(208, 188, 255, 0.35);
      
      --color-primary: #D0BCFF;
      --color-on-primary: #381E72;
      --color-primary-container: #4F378B;
      --color-on-primary-container: #EADDFF;
      --color-surface: #E6E0E9;
      --color-variant: #CAC4D0;

      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-full: 9999px;
      --bottom-nav-height: 72px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Comfortaa', cursive, sans-serif;
    }

    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      vertical-align: middle;
    }
    .material-symbols-rounded.filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    html, body {
      background-color: #08060f;
      color: var(--color-surface);
      width: 100%;
      min-height: 100dvh;
      display: flex;
      overflow-x: hidden;
      position: relative;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.35;
      animation: floatOrbs 12s ease-in-out infinite alternate;
    }
    body::before { top: -150px; left: -150px; background: rgba(115, 74, 186, 0.6); }
    body::after { bottom: -150px; right: -150px; background: rgba(85, 30, 130, 0.7); animation-delay: -6s; }

    @keyframes floatOrbs {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(40px) scale(1.1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #continueWatchCard {
      flex-direction: row;
      align-items: center;
      cursor: pointer;
      padding: 12px;
      gap: 14px;
      width: 100%;
    }
    .continue-poster-wrap {
      width: 65px;
      height: 90px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: #000;
    }
    .continue-poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .continue-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .continue-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .continue-subtitle {
      font-size: 12px;
      color: var(--color-variant);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
    .continue-btn {
      height: 36px;
      padding: 0 14px;
      font-size: 12px;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      #continueWatchCard { padding: 10px; gap: 10px; }
      .continue-poster-wrap { width: 55px; height: 78px; }
      .continue-title { font-size: 13px; }
      .continue-subtitle { font-size: 11px; -webkit-line-clamp: 2; }
      .continue-btn { padding: 0 10px; font-size: 11px; height: 32px; }
    }

    .nav-rail {
      width: 92px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      gap: 24px;
      box-shadow: 15px 0 40px rgba(0, 0, 0, 0.4);
    } 

    .catalog-switch-container {
      display: flex;
      background: var(--glass-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      padding: 4px;
      margin-bottom: 20px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    .catalog-switch-tab {
      flex: 1;
      height: 42px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--color-variant);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .catalog-switch-tab:hover { color: var(--color-surface); }
    .catalog-switch-tab.active {
      background: linear-gradient(135deg, rgba(208, 188, 255, 0.25) 0%, rgba(179, 157, 219, 0.2) 100%);
      color: var(--color-primary);
      border: 1px solid var(--glass-border-glow);
      box-shadow: 0 4px 15px rgba(208, 188, 255, 0.15);
      font-weight: 700;
    }

    .header-profile-btn {
      width: 45px;
      height: 45px;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(208, 188, 255, 0.25);
      border: 2px solid var(--color-primary);
      background: rgba(208, 188, 255, 0.15);
      color: var(--color-primary);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
      flex-shrink: 0;
    }

    .tg-header-btn {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(208, 188, 255, 0.15);
      border: 1px solid var(--glass-border);
      background: var(--glass-surface);
      color: var(--color-primary);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .tg-header-btn:hover {
      transform: scale(1.08);
      background: rgba(208, 188, 255, 0.2);
      border-color: var(--glass-border-glow);
    }
    .tg-header-btn .material-symbols-rounded { font-size: 20px; }
    
    .header-profile-btn:hover { transform: scale(1.08); background: rgba(208, 188, 255, 0.25); }
    .header-profile-btn img { width: 100%; height: 100%; object-fit: cover; }

    .nav-items { display: flex; flex-direction: column; gap: 16px; width: 100%; align-items: center; }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--color-variant);
      cursor: pointer;
      width: 100%;
      font-size: 11px;
      transition: color 0.2s;
    }
    .nav-pill {
      width: 60px;
      height: 36px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-item:hover { color: var(--color-surface); }
    .nav-item:hover .nav-pill { background: rgba(255, 255, 255, 0.05); }
    .nav-item.active { color: var(--color-primary); }
    .nav-item.active .nav-pill {
      background: rgba(208, 188, 255, 0.2);
      box-shadow: inset 0 0 0 1.5px rgba(208, 188, 255, 0.4), 0 4px 15px rgba(208, 188, 255, 0.2);
    }
    .nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; }

    .app-main {
      flex: 1;
      margin-left: 92px;
      padding: 24px 28px 56px;
      width: calc(100% - 92px);
      max-width: 100%;
      overflow-x: hidden;
    }

    .app-header-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 8px;
    }
    .brand-title-text {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #D0BCFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 25px rgba(208, 188, 255, 0.25);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .brand-title-text:hover { opacity: 0.85; }
    .brand-group { display: flex; flex-direction: column; gap: 0; min-width: 0; }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-subtitle {
      font-size: 10px;
      font-weight: 500;
      color: var(--color-variant);
      opacity: 0.7;
      letter-spacing: 0.3px;
      padding-left: 2px;
      margin-top: -2px;
      line-height: 1;
    }

    .header-right-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .lang-switcher {
      display: inline-flex;
      flex-direction: column;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }
    .lang-btn {
      padding: 5px 8px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--color-variant);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: rgba(208, 188, 255, 0.25);
      color: var(--color-primary);
      box-shadow: 0 0 8px rgba(208, 188, 255, 0.2);
    }

    .top-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .search-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search-container {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-full);
      padding: 6px 12px 6px 20px;
      height: 52px;
      gap: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .search-container:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 10px 40px rgba(208, 188, 255, 0.2), inset 0 0 0 1.5px rgba(208, 188, 255, 0.3);
      transform: translateY(-2px);
    }
    .search-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--color-surface);
      font-size: 15px;
    }
    .search-input::placeholder { color: var(--color-variant); opacity: 0.7; }
    .filters-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filter-select {
      background: var(--glass-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--color-surface);
      padding: 8px 14px;
      border-radius: var(--radius-full);
      font-size: 13px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .filter-select:hover, .filter-select:focus { border-color: var(--glass-border-glow); }
    .filter-select option { background: #18151c; color: var(--color-surface); }

    .genres-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      width: 100%;
      scrollbar-width: none;
    }
    .genres-bar::-webkit-scrollbar { display: none; }
    .genre-chip {
      padding: 7px 16px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--color-variant);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .genre-chip:hover { background: rgba(255, 255, 255, 0.08); color: var(--color-surface); }
    .genre-chip.active {
      background: rgba(208, 188, 255, 0.2);
      border-color: var(--glass-border-glow);
      color: var(--color-primary);
      box-shadow: 0 0 12px rgba(208, 188, 255, 0.2);
    }

    .md-btn {
      height: 44px;
      padding: 0 20px;
      border-radius: var(--radius-full);
      border: none;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }
    .md-btn:hover { transform: scale(1.04); }
    .md-btn:active { transform: scale(0.96); }
    .md-btn-filled {
      background: linear-gradient(135deg, #D0BCFF 0%, #b39ddb 100%);
      color: var(--color-on-primary);
      box-shadow: 0 6px 20px rgba(208, 188, 255, 0.35);
    }
    .md-btn-tonal {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--color-surface);
    }
    .md-btn-tonal:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--glass-border-glow); }

    .player-source-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .player-source-bar .md-btn {
      height: 38px;
      padding: 0 16px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }
    .player-source-bar .md-btn.active {
      background: rgba(208, 188, 255, 0.25) !important;
      border-color: var(--glass-border-glow) !important;
      color: var(--color-primary) !important;
      box-shadow: 0 0 14px rgba(208, 188, 255, 0.2);
    }

    .megaplay-lang-switch {
      display: none;
      gap: 6px;
      margin-left: auto;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
    }
    .megaplay-lang-btn {
      padding: 5px 10px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--color-variant);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .megaplay-lang-btn.active { background: var(--color-primary); color: var(--color-on-primary); }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }
    .section-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }
    .anime-card {
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .anime-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--glass-border-glow);
      box-shadow: 0 16px 50px rgba(208, 188, 255, 0.2);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 2.85;
      background: rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .anime-card:hover .poster-wrap img { transform: scale(1.06); }
    .card-badges {
      position: absolute;
      top: 10px; left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 4;
    }
    .badge-pill {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      background: rgba(12, 9, 20, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--color-surface);
    }
    .badge-pill.rating { color: #FFD54F; }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 12px;
      color: var(--color-variant);
      margin-bottom: 6px;
    }
    .card-add-wrapper { position: relative; margin-top: auto; }
    .card-add-btn {
      width: 100%;
      height: 34px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--color-surface);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card-add-btn:hover {
      background: rgba(208, 188, 255, 0.15);
      border-color: var(--glass-border-glow);
      color: var(--color-primary);
    }

    .watch-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
      align-items: start;
      width: 100%;
      max-width: 100%;
    }

    .player-card {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 100%;
    }

    .video-stage {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }
    .video-stage iframe { width: 100%; height: 100%; border: none; display: block; }

    .player-toolbar {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 12, 22, 0.7);
      border-top: 1px solid var(--glass-border);
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
    }

    .sidebar-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }

    .voice-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 200px; overflow-y: auto; }
    .voice-chip {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      color: var(--color-surface);
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      transition: all 0.2s;
    }
    .voice-chip:hover { background: rgba(255, 255, 255, 0.08); }
    .voice-chip.active { background: rgba(208, 188, 255, 0.2); border-color: var(--glass-border-glow); color: var(--color-primary); }

    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; }
    .ep-btn {
      height: 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);

  <script>
    const KODIK_TOKEN = '447d179e875efe44217f20d1ee2146be';
    const BACKEND_URL = 'https://api.komboko.fun';
    const SHIKI_CLIENT_ID = '2gnAwexNcV7ENj62zeIAvBI9q7c63O9z5mWSR6k5oRo';
    const PLAYER_SOURCES = ['kodik', 'megaplay'];

    let state = {
      animes: [],
      itemsRegistry: {},
      currentAnimeFull: null,
      currentVariantIndex: 0,
      currentEpisodeNum: 1,
      currentSource: 'kodik',
      megaplayLang: 'sub',
      currentUser: null,
      userRates: {},
      history: JSON.parse(localStorage.getItem('kodik_history') || '[]'),
      mangaHistory: JSON.parse(localStorage.getItem('komboko_manga_history') || '[]'),
      selectedGenre: '',
      genresMap: {
        'романтика': '22', 'romance': '22',
        'комедия': '4', 'comedy': '4',
        'экшен': '1', 'action': '1',
        'фантастика': '24', 'sci-fi': '24',
        'фэнтези': '10', 'fantasy': '10',
        'повседневность': '36', 'slice of life': '36',
        'приключения': '2', 'adventure': '2',
        'триллер': '41', 'thriller': '41'
      },
      page: 1,
      limit: 24,
      isLoading: false,
      hasMore: true,
      currentQuery: '',
      currentTab: 'catalog'
    };

    let currentCatalogMode = 'anime'; // 'anime' | 'manga'
    let activeFetchId = 0;

    window.addEventListener('DOMContentLoaded', async () => {
      const yearSelect = document.getElementById('filterYear');
      for (let y = 2026; y >= 1970; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
      }

      window.addEventListener('scroll', () => {
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 500) {
          if (!state.isLoading && state.hasMore && document.getElementById('view-catalog').style.display !== 'none' && state.currentTab === 'catalog') {
            if (currentCatalogMode === 'manga') fetchMangaCatalog(false);
            else fetchShikimoriCatalog(false);
          }
        }
      });

      // Авторизация Shikimori
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (code) {
        window.history.replaceState({}, document.title, window.location.pathname);
        try {
          const redirectUri = window.location.origin + window.location.pathname;
          const res = await fetch(`${BACKEND_URL}/api/shikimori_auth`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, redirect_uri: redirectUri })
          });
          const tokenData = await res.json();
          if (tokenData.access_token) {
            localStorage.setItem('shiki_token', tokenData.access_token);
            await fetchUserProfile(tokenData.access_token);
          }
        } catch (err) {}
      } else {
        const savedToken = localStorage.getItem('shiki_token');
        if (savedToken) await fetchUserProfile(savedToken);
      }

      renderContinueWatchingBlock();
      fetchShikimoriCatalog(true);
    });

    function switchCatalogTab(mode) {
      if (currentCatalogMode === mode && state.animes.length > 0) return;
      currentCatalogMode = mode;
      
      activeFetchId++;
      state.isLoading = false;
      state.page = 1;
      state.animes = [];
      state.hasMore = true;

      const btnAnime = document.getElementById('switchTabAnime');
      const btnManga = document.getElementById('switchTabManga');
      const filtersRow = document.getElementById('catalogFiltersRow');
      const genresBar = document.getElementById('genresBar');
      const searchInput = document.getElementById('searchInput');

      btnAnime.classList.toggle('active', mode === 'anime');
      btnManga.classList.toggle('active', mode === 'manga');

      if (mode === 'anime') {
        if (filtersRow) filtersRow.style.display = 'flex';
        if (genresBar) genresBar.style.display = 'flex';
        if (searchInput) searchInput.placeholder = 'Название аниме или ID...';
        fetchShikimoriCatalog(true);
      } else {
        if (filtersRow) filtersRow.style.display = 'none';
        if (genresBar) genresBar.style.display = 'none'; // ЖАНРЫ ДЛЯ МАНГИ ПОЛНОСТЬЮ ВЫРЕЗАНЫ
        state.selectedGenre = '';
        if (searchInput) searchInput.placeholder = 'Название манги...';
        fetchMangaCatalog(true);
      }
    }

    function filterByGenre(genreKey, btnElement) {
      document.querySelectorAll('.genre-chip').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      state.selectedGenre = genreKey;
      resetAndFetchCatalog();
    }

    // Запрос манги без жанров
    async function fetchGraphQLMangas({ page = 1, limit = 24, order = 'popularity', search = '' }) {
      const query = `
        query($page: Int, $limit: Int, $order: OrderEnum, $search: String) {
          mangas(page: $page, limit: $limit, order: $order, search: $search, censored: false) {
            id
            name
            russian
            score
            kind
            status
            chapters
            volumes
            airedOn { year }
            poster { originalUrl mainUrl }
            description
          }
        }
      `;
      const variables = { page, limit, order };
      if (search) variables.search = search;

      const res = await fetch('https://shikimori.io/api/graphql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query, variables })
      });

      if (res.ok) {
        const json = await res.json();
        if (json && json.data && Array.isArray(json.data.mangas)) return json.data.mangas;
      }
      throw new Error('Manga GraphQL Failed');
    }

    async function fetchMangaCatalog(reset = true, query = '') {
      if (state.isLoading || (!reset && !state.hasMore)) return;
      state.isLoading = true;
      const myFetchId = ++activeFetchId;

      if (reset) {
        state.page = 1;
        state.animes = [];
        state.hasMore = true;
        if (query !== '') state.currentQuery = query;

        loader.style.display = 'flex';
      }

      try {
        const rawItems = await fetchGraphQLMangas({
          page: state.page,

        });

          isManga: true
        }));

        if (parsedManga.length < state.limit) state.hasMore = false;

        if (state.page === 1) state.animes = parsedManga;
        else state.animes = [...state.animes, ...parsedManga];

        state.page++;
        renderMangaGrid(state.animes);
      } catch (err) {
        if (myFetchId === activeFetchId && state.page === 1) {
          grid.innerHTML = `<p style="grid-column:1/-1; color:#F2B8B5; text-align:center;">Ошибка загрузки каталога манги</p>`;

          state.isLoading = false;
          loader.style.display = 'none';
        }
      }

    // === ЧИТАЛКА МАНГИ (ПОРТИРОВАНА ИЗ KOTLIN MANGADEX / REMANGA)[span_7](start_span)[span_7](end_span) ===
    let mangaReaderState = {
      shikiItem: null,
      source: 'mangadex',
      chapters: [],
      currentChapterIndex: 0
    };

    async function fetchProxyJson(targetUrl) {
      const proxies = [
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];
      for (const buildProxy of proxies) {
        try {
          const res = await fetch(buildProxy(targetUrl));
          if (res.ok) {
            const json = await res.json();
            if (json) return json;
          }
        } catch (e) {}
      }
      throw new Error('Proxy failed for ' + targetUrl);
    }

    async function openMangaReader(shikiId) {
      const item = state.itemsRegistry[String(shikiId)];
      if (!item) return;

      state.lastScrollY = window.scrollY;
      switchTab('manga-reader', false);

      mangaReaderState.shikiItem = item;
      mangaReaderState.chapters = [];
      mangaReaderState.source = 'mangadex';

      document.getElementById('mangaReaderTitle').textContent = item.titleRu;
      updateMangaSourceButtons();

      // Сохраняем в историю манги
      state.mangaHistory = [item, ...state.mangaHistory.filter(m => m.id !== item.id)].slice(0, 30);
      localStorage.setItem('komboko_manga_history', JSON.stringify(state.mangaHistory));

      await loadCurrentMangaSource();
    }

    function goBackFromMangaReader() {
      switchTab('catalog', false);
      if (currentCatalogMode === 'manga') renderMangaGrid(state.animes);
      else renderGrid(state.animes, 'animeGrid', false);
      setTimeout(() => window.scrollTo({ top: state.lastScrollY || 0, behavior: 'instant' }), 20);

    function updateMangaSourceButtons() {
      const isMd = mangaReaderState.source === 'mangadex';
      document.getElementById('mangaSrc-mangadex')?.classList.toggle('active', isMd);
      document.getElementById('mangaSrc-remanga')?.classList.toggle('active', !isMd);
    }

    async function switchMangaSource(src) {
      if (mangaReaderState.source === src) return;
      mangaReaderState.source = src;
      updateMangaSourceButtons();
      await loadCurrentMangaSource();
    }

    async function loadCurrentMangaSource() {
      const pagesBox = document.getElementById('mangaPagesScroll');
      const select = document.getElementById('mangaChapterSelect');
      select.innerHTML = '<option>Поиск глав...</option>';
      pagesBox.innerHTML = `<div class="spinner" style="margin-top:60px;"></div><p style="color:var(--color-variant); font-size:13px; margin-top:10px;">Загружаем главы...</p>`;

      const item = mangaReaderState.shikiItem;
      const searchTitle = item.titleEn || item.titleRu;

      if (mangaReaderState.source === 'mangadex') {
        try {
          const searchUrl = `https://api.mangadex.org/manga?title=${encodeURIComponent(searchTitle)}&limit=5&order[relevance]=desc`;
          const sData = await fetchProxyJson(searchUrl);
          if (!sData?.data?.length) throw new Error('Not found on MangaDex');

          const mdId = sData.data[0].id;
          const feedUrl = `https://api.mangadex.org/manga/${mdId}/feed?translatedLanguage[]=ru&order[chapter]=asc&limit=500`;
          const fData = await fetchProxyJson(feedUrl);

          const seen = new Set();
          const chs = [];
          (fData?.data || []).forEach(ch => {
            if (ch.attributes.externalUrl) return;
            const num = ch.attributes.chapter || '1';
            if (!seen.has(num)) {
              seen.add(num);
              chs.push({ id: ch.id, chapter: num, title: ch.attributes.title || '', source: 'mangadex' });
            }
          });

          if (!chs.length) throw new Error('No RU chapters');
          mangaReaderState.chapters = chs;
          select.innerHTML = chs.map((c, i) => `<option value="${i}">Глава ${c.chapter} ${c.title ? '- ' + c.title : ''}</option>`).join('');
          await selectMangaChapterByIndex(0);
        } catch (e) {
          pagesBox.innerHTML = `<p style="color:#F2B8B5; padding:40px; text-align:center;">На MangaDex нет глав на русском. Переключаемся на ReManga...</p>`;
          setTimeout(() => switchMangaSource('remanga'), 1200);
        }
      } else {
        // ReManga[span_8](start_span)[span_8](end_span)
        try {
          const sUrl = `https://api.remanga.org/api/search/?query=${encodeURIComponent(item.titleRu)}&count=5`;
          const sData = await fetchProxyJson(sUrl);
          const dir = sData?.content?.[0]?.dir;
          if (!dir) throw new Error('Not found on ReManga');

          const tUrl = `https://api.remanga.org/api/titles/${dir}/`;
          const tData = await fetchProxyJson(tUrl);
          const branchId = tData?.content?.branches?.[0]?.id;
          if (!branchId) throw new Error('No branch');

          const chUrl = `https://api.remanga.org/api/titles/chapters/?branch_id=${branchId}&count=500&ordering=index`;
          const chData = await fetchProxyJson(chUrl);

          const chs = (chData?.content || []).map(c => ({
            id: c.id,
            chapter: String(c.chapter || c.index || '1'),
            title: c.name || '',
            source: 'remanga'
          }));

          if (!chs.length) throw new Error('No ReManga chapters');
          mangaReaderState.chapters = chs;
          select.innerHTML = chs.map((c, i) => `<option value="${i}">Глава ${c.chapter} ${c.title ? '- ' + c.title : ''}</option>`).join('');
          await selectMangaChapterByIndex(0);
        } catch (e) {
          pagesBox.innerHTML = `<p style="color:#F2B8B5; padding:40px; text-align:center;">Не удалось найти главы на ReManga.</p>`;
        }
      }
    }

    function stepMangaChapter(delta) {
      const target = mangaReaderState.currentChapterIndex + delta;
      if (target >= 0 && target < mangaReaderState.chapters.length) {
        selectMangaChapterByIndex(target);
      }
    }

    async function selectMangaChapterByIndex(index) {
      const ch = mangaReaderState.chapters[index];
      if (!ch) return;

      mangaReaderState.currentChapterIndex = index;
      document.getElementById('mangaChapterSelect').value = String(index);

      const pagesBox = document.getElementById('mangaPagesScroll');
      pagesBox.innerHTML = `<div class="spinner" style="margin-top:60px;"></div><p style="color:var(--color-variant); font-size:13px; margin-top:10px;">Загружаем страницы главы ${ch.chapter}...</p>`;

      try {
        let pages = [];
        if (ch.source === 'mangadex') {
          const atHome = await fetchProxyJson(`https://api.mangadex.org/at-home/server/${ch.id}`);
          const bUrl = atHome.baseUrl;
          const hash = atHome.chapter.hash;
          const files = atHome.chapter.data;
          pages = files.map(f => `${bUrl}/data/${hash}/${f}`);
        } else {
          const chData = await fetchProxyJson(`https://api.remanga.org/api/titles/chapters/${ch.id}/`);
          const raw = chData?.content?.pages?.flat() || [];
          pages = raw.map(p => {
            const link = typeof p === 'string' ? p : (p.link || p.url || '');
            return link.startsWith('http') ? link : `https://remanga.org/media/${link.replace(/^\/?media\/?/, '')}`;
          }).filter(Boolean);
        }

        pagesBox.innerHTML = `<div style="font-size:12px; color:var(--color-variant); margin-bottom:8px;">Глава ${ch.chapter} • Страниц: ${pages.length}</div>`;
        pages.forEach(url => {
          const safeUrl = `https://wsrv.nl/?url=${encodeURIComponent(url)}`;
          const img = document.createElement('img');
          img.src = safeUrl;
          img.loading = 'lazy';
          pagesBox.appendChild(img);
        });
      } catch (e) {
        pagesBox.innerHTML = `<p style="color:#F2B8B5; padding:40px; text-align:center;">Ошибка загрузки страниц этой главы.</p>`;
      }
    }

    // === АНИМЕ КАТАЛОГ И СИНХРОНИЗАЦИЯ ===
    async function fetchGraphQLAnimes({ page = 1, limit = 24, order = 'popularity', kind = '', season = '', status = '', genre = '', search = '', ids = '' }) {
      const query = `
        query($page: Int, $limit: Int, $order: OrderEnum, $kind: AnimeKindString, $season: SeasonString, $status: AnimeStatusString, $genre: String, $search: String, $ids: String) {
          animes(page: $page, limit: $limit, order: $order, kind: $kind, season: $season, status: $status, genre: $genre, search: $search, ids: $ids, censored: false) {
            id
            name
            english
            russian
            score
            kind
            status
            episodes
            episodesAired
            airedOn { year }
            poster { originalUrl mainUrl }
            description
          }
        }
      `;
      const variables = { page, limit, order };
      if (kind) variables.kind = kind;
      if (season) variables.season = String(season);
      if (status) variables.status = status;
      if (genre) variables.genre = String(genre); // ЧИСЛОВОЙ ID ДЛЯ АНИМЕ
      if (search) variables.search = search;
      if (ids) variables.ids = String(ids);

      const res = await fetch('https://shikimori.io/api/graphql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query, variables })
      });

      if (res.ok) {
        const json = await res.json();
        if (json?.data?.animes) return json.data.animes;
      }
      throw new Error('GraphQL Animes Failed');
    }

    async function fetchShikimoriCatalog(reset = true, query = '') {
      if (state.isLoading || (!reset && !state.hasMore)) return;
      state.isLoading = true;
      const myFetchId = ++activeFetchId;

      if (reset) {
        state.page = 1;
        state.animes = [];
        state.hasMore = true;
        if (query !== '') state.currentQuery = query;
      }

      const grid = document.getElementById('animeGrid');
      const loader = document.getElementById('infiniteLoader');

      if (state.page === 1) {
        grid.innerHTML = `<div class="loader-box"><div class="spinner"></div><span>Загружаем каталог аниме...</span></div>`;
      } else {
        loader.style.display = 'flex';
      }

      const typeVal = document.getElementById('filterType').value;
      const yearVal = document.getElementById('filterYear').value;
      const statusVal = document.getElementById('filterStatus').value;
      const orderVal = document.getElementById('filterOrder').value || 'popularity';
      
      // Официальный ID жанра Shikimori
      const genreId = state.genresMap[state.selectedGenre.toLowerCase().trim()] || '';

      try {
        const isSingleIdSearch = state.currentQuery && /^\d+$/.test(state.currentQuery);
        let rawItems = [];

        if (isSingleIdSearch) {
          rawItems = await fetchGraphQLAnimes({ ids: state.currentQuery, limit: 1 });
        } else {
          rawItems = await fetchGraphQLAnimes({
            page: state.page, limit: state.limit, order: orderVal,
            kind: typeVal, season: yearVal, status: statusVal,
            genre: genreId, search: state.currentQuery
          });
        }

        if (myFetchId !== activeFetchId || currentCatalogMode !== 'anime') return;

        const newItems = rawItems.filter(Boolean).map(item => ({
          id: String(item.id),
          titleRu: item.russian || item.name || 'Без названия',
          titleEn: item.english?.[0] || item.name || 'Untitled',
          year: item.airedOn?.year ? String(item.airedOn.year) : '2024',
          episodes: item.episodes || item.episodesAired || 12,
          rating: item.score && Number(item.score) > 0 ? item.score : null,
          poster: item.poster?.originalUrl || item.poster?.mainUrl || '',
          description: (item.description || 'Описание отсутствует.').replace(/\[.*?\]/g, ''),
          kind: item.kind || 'TV'
        }));

        if (newItems.length < state.limit || isSingleIdSearch) state.hasMore = false;

        if (state.page === 1) state.animes = newItems;
        else state.animes = [...state.animes, ...newItems];

        state.page++;
        renderGrid(state.animes, 'animeGrid', false);
      } catch (err) {
        if (myFetchId === activeFetchId && state.page === 1) {
          grid.innerHTML = `<p style="grid-column:1/-1; color:#F2B8B5; text-align:center;">Ничего не найдено.</p>`;
        }
      } finally {
        if (myFetchId === activeFetchId) {
          state.isLoading = false;
          loader.style.display = 'none';
        }
      }
    }

    async function loadKodikPlayerForAnime(item) {
      switchTab('watch', false);
      window.location.hash = '#/' + item.id;
      
      state.currentSource = 'kodik';
      document.getElementById('watchTitle').textContent = item.titleRu;
      document.getElementById('detailsPosterWrap').innerHTML = `<img class="details-poster" src="${item.poster}" />`;
      document.getElementById('detailsDesc').textContent = item.description;
      document.getElementById('detailsMeta').textContent = `${item.year} • ${(item.kind || 'TV').toUpperCase()}`;

      state.currentAnimeFull = item;
      state.currentEpisodeNum = 1;
      state.currentVariantIndex = 0;

      // Обновляем селектор статуса БЕЗ автодобавления в список
      const token = localStorage.getItem('shiki_token');
      if (token) {
        const select = document.getElementById('shikiStatusSelect');
        const rate = state.userRates[item.id];
        select.value = rate ? rate.status : '';
        document.getElementById('shikiStatusContainer').style.display = 'flex';
      }

      // Сохраняем локальную историю просмотра (БЕЗ спама в Shikimori)
      state.history = [item, ...state.history.filter(a => a.id !== item.id)].slice(0, 30);
      localStorage.setItem('kodik_history', JSON.stringify(state.history));

      // Загрузка озвучек Kodik
      const apiUrl = `https://kodikapi.com/search?token=${KODIK_TOKEN}&shikimori_id=${item.id}&with_episodes=true&with_material_data=true`;
      let kodikResults = [];
      try {
        const proxyRes = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`);
        const data = await proxyRes.json();
        if (data?.results) kodikResults = data.results;
      } catch (_) {}

      state.currentAnimeFull = parseKodikVariants(item, kodikResults);

      renderVoiceChips();
      renderEpisodesGrid();
      loadCurrentEpisodeVideo();
    }

    function parseKodikVariants(baseItem, results) {
      let variants = [];
      for (const r of results) {
        const translation = r.translation || { id: 0, title: 'Оригинал' };
        const episodes = {};
        if (r.seasons) {
          for (const sKey of Object.keys(r.seasons)) {
            const seasonObj = r.seasons[sKey];
            if (seasonObj?.episodes) {
              for (const [epNum, epData] of Object.entries(seasonObj.episodes)) {
                episodes[epNum] = typeof epData === 'string' ? epData : epData.link;
              }
            }
          }
        }
        if (Object.keys(episodes).length === 0 && r.link) episodes['1'] = r.link;
        if (Object.keys(episodes).length > 0) variants.push({ translation, default_link: r.link, episodes });
      }

      if (variants.length === 0) {
        const episodes = {};
        for (let i = 1; i <= (baseItem.episodes || 12); i++) {
          episodes[String(i)] = `https://kodik.info/find-player?shikimoriID=${baseItem.id}&episode=${i}`;
        }
        variants.push({ translation: { id: 0, title: 'Kodik' }, default_link: `https://kodik.info/find-player?shikimoriID=${baseItem.id}`, episodes });
      }

      return { ...baseItem, variants };
    }

    function renderVoiceChips() {
      const container = document.getElementById('voiceList');
      container.innerHTML = '';
      const variants = state.currentAnimeFull.variants;
      document.getElementById('voicesCount').textContent = variants.length;

      variants.forEach((v, idx) => {
        const btn = document.createElement('button');
        btn.className = `voice-chip ${idx === state.currentVariantIndex ? 'active' : ''}`;
        btn.textContent = v.translation.title;
        btn.onclick = () => {
          state.currentVariantIndex = idx;
          renderVoiceChips();
          renderEpisodesGrid();
          loadCurrentEpisodeVideo();
        };
        container.appendChild(btn);
      });
    }

    function renderEpisodesGrid() {
      const grid = document.getElementById('episodesGrid');
      grid.innerHTML = '';
      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      if (!variant) return;

      const epNumbers = Object.keys(variant.episodes).sort((a, b) => Number(a) - Number(b));
      epNumbers.forEach((epStr) => {
        const epNum = Number(epStr);
        const btn = document.createElement('button');
        btn.className = `ep-btn ${epNum === state.currentEpisodeNum ? 'active' : ''}`;
        btn.textContent = epNum;
        btn.onclick = () => {
          state.currentEpisodeNum = epNum;
          renderEpisodesGrid();
          loadCurrentEpisodeVideo();
          // СИНХРОНИЗАЦИЯ ПРОГРЕССА ТОЛЬКО ПРИ РЕАЛЬНОМ ПЕРЕКЛЮЧЕНИИ СЕРИИ
          updateShikimoriProgress(state.currentAnimeFull.id, epNum);
        };
        grid.appendChild(btn);
      });
    }

    function loadCurrentEpisodeVideo() {
      if (!state.currentAnimeFull) return;
      const epNum = state.currentEpisodeNum || 1;
      const targetId = state.currentAnimeFull.id;
      const iframe = document.getElementById('kodikIframe');
      const openLink = document.getElementById('openInNewTab');
      document.getElementById('currentEpLabel').textContent = `Серия ${epNum}`;

      localStorage.setItem(`komboko_progress_${targetId}`, JSON.stringify({ episode: epNum }));

      if (state.currentSource === 'megaplay') {
        const streamUrl = `https://megaplay.buzz/stream/mal/${targetId}/${epNum}/${state.megaplayLang}`;
        openLink.href = streamUrl;
        iframe.src = streamUrl;
        return;
      }

      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      if (!variant) return;

      let rawLink = variant.episodes[String(epNum)] || variant.default_link;
      let cleanUrl = rawLink.startsWith('//') ? `https:${rawLink}` : rawLink;
      cleanUrl = cleanUrl.replace('kodik.info', 'kodikplayer.com');
      if (cleanUrl.includes('episode=')) cleanUrl = cleanUrl.replace(/episode=\d+/, `episode=${epNum}`);
      else cleanUrl += (cleanUrl.includes('?') ? '&' : '?') + `episode=${epNum}`;

      openLink.href = cleanUrl;
      iframe.src = cleanUrl;
    }

    function stepEpisode(delta) {
      if (!state.currentAnimeFull) return;
      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      const target = state.currentEpisodeNum + delta;
      if (variant && variant.episodes[String(target)]) {
        state.currentEpisodeNum = target;
        renderEpisodesGrid();
        loadCurrentEpisodeVideo();
        updateShikimoriProgress(state.currentAnimeFull.id, target);
      }
    }

    function switchPlayerSource(src) {
      state.currentSource = src;
      document.getElementById('btnSource-kodik')?.classList.toggle('active', src === 'kodik');
      document.getElementById('btnSource-megaplay')?.classList.toggle('active', src === 'megaplay');
      document.getElementById('voiceSection').style.display = (src === 'kodik') ? 'block' : 'none';
      document.getElementById('megaplayLangSwitch').style.display = (src === 'megaplay') ? 'flex' : 'none';
      loadCurrentEpisodeVideo();
    }

    function setMegaPlayLang(lang) {
      state.megaplayLang = lang;
      document.getElementById('btnMegaSub')?.classList.toggle('active', lang === 'sub');
      document.getElementById('btnMegaDub')?.classList.toggle('active', lang === 'dub');
      loadCurrentEpisodeVideo();
    }

    // Синхронизация прогресса только когда юзер сам выбрал серию
    async function updateShikimoriProgress(animeId, episodeNum) {
      const token = localStorage.getItem('shiki_token');
      if (!token || !state.currentUser) return;

      const rate = state.userRates[animeId];
      if (rate) {
        try {
          await fetch(`https://shikimori.io/api/v2/user_rates/${rate.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ user_rate: { episodes: episodeNum } })
          });
        } catch (_) {}
      }
    }

    // Ручное обновление статуса списка
    async function updateUserAnimeStatus(newStatus) {
      const token = localStorage.getItem('shiki_token');
      if (!token || !state.currentUser || !state.currentAnimeFull) return;

      const animeId = state.currentAnimeFull.id;
      const rate = state.userRates[animeId];

      try {
        if (!newStatus) {
          if (rate) {
            await fetch(`https://shikimori.io/api/v2/user_rates/${rate.id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            delete state.userRates[animeId];
          }
          return;
        }

        if (rate) {
          const res = await fetch(`https://shikimori.io/api/v2/user_rates/${rate.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ user_rate: { status: newStatus } })
          });
          state.userRates[animeId] = await res.json();
        } else {
          const res = await fetch(`https://shikimori.io/api/v2/user_rates`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ user_rate: { status: newStatus, target_id: animeId, target_type: 'Anime', user_id: state.currentUser.id } })
          });
          state.userRates[animeId] = await res.json();
        }
      } catch (_) {}
    }

    async function fetchUserProfile(token) {
      try {
        const res = await fetch('https://shikimori.io/api/users/whoami', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const user = await res.json();
        if (user?.id) {
          state.currentUser = user;
          const avatar = user.image?.x160 || user.image?.x48 || 'https://shikimori.io/favicons/apple-touch-icon-180x180.png';
          ['sidebarAuthLogo', 'headerAuthLogo'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = `<img src="${avatar}" style="width:100%;height:100%;border-radius:12px;object-fit:cover;" />`;
          });
          fetchAllUserRates(user.id, token);
        }
      } catch (_) {}
    }

    async function fetchAllUserRates(userId, token) {
      try {
        const res = await fetch(`https://shikimori.io/api/v2/user_rates?user_id=${userId}&target_type=Anime`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const rates = await res.json();
        if (Array.isArray(rates)) {
          state.userRates = {};
          rates.forEach(r => { state.userRates[r.target_id] = r; });
          renderContinueWatchingBlock();
        }
      } catch (_) {}
    }

    async function fetchUserRatesList(statusFilter) {
      const grid = document.getElementById('userListsGrid');
      const token = localStorage.getItem('shiki_token');

      if (!token || !state.currentUser) {
        grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--color-variant); text-align:center;">Войдите в аккаунт Shikimori для просмотра списков.</p>`;
        return;
      }

      grid.innerHTML = `<div class="loader-box"><div class="spinner"></div></div>`;

      try {
        const res = await fetch(`https://shikimori.io/api/v2/user_rates?user_id=${state.currentUser.id}&status=${statusFilter}&target_type=Anime`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const rates = await res.json();
        if (Array.isArray(rates) && rates.length > 0) {
          const ids = rates.map(r => r.target_id).join(',');
          const animes = await fetchGraphQLAnimes({ ids, limit: 50 });
          renderGrid(animes.map(item => ({
            id: String(item.id),
            titleRu: item.russian || item.name,
            titleEn: item.english?.[0] || item.name,
            year: item.airedOn?.year ? String(item.airedOn.year) : '2024',
            episodes: item.episodes || 12,
            rating: item.score,
            poster: item.poster?.originalUrl || item.poster?.mainUrl || '',
            kind: item.kind || 'TV'
          })), 'userListsGrid', false);
        } else {
          grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--color-variant); text-align:center;">Список пуст.</p>`;
        }
      } catch (_) {
        grid.innerHTML = `<p style="grid-column:1/-1; color:#F2B8B5; text-align:center;">Ошибка загрузки списков</p>`;
      }
    }

    function renderContinueWatchingBlock() {
      const section = document.getElementById('continueWatchSection');
      if (!section || !state.history.length) {
        if (section) section.style.display = 'none';
        return;
      }

      const last = state.history[0];
      const savedProgress = JSON.parse(localStorage.getItem(`komboko_progress_${last.id}`) || '{}');
      const ep = savedProgress.episode || 1;

      document.getElementById('continueTitleText').textContent = last.titleRu;
      document.getElementById('continueMeta').textContent = `${last.year} • ${(last.kind || 'TV').toUpperCase()}`;
      document.getElementById('continueSubtitleText').textContent = `Ты остановился на ${ep}-й серии. Продолжить?`;
      document.getElementById('continuePosterWrap').innerHTML = `<img src="${last.poster}" />`;
      section.style.display = 'block';
    }

    function resumeLastAnime() {
      if (state.history.length > 0) loadKodikPlayerForAnime(state.history[0]);
    }

    function handleSearchSubmit(e) {
      e.preventDefault();
      state.currentQuery = document.getElementById('searchInput').value.trim();
      switchTab('catalog');
      resetAndFetchCatalog();
    }

    function resetAndFetchCatalog() {
      state.page = 1;
      state.animes = [];
      state.hasMore = true;
      if (currentCatalogMode === 'manga') fetchMangaCatalog(true);
      else fetchShikimoriCatalog(true);
    }

    function resetToMainCatalog() {
      document.getElementById('searchInput').value = '';
      state.currentQuery = '';
      state.selectedGenre = '';
      document.querySelectorAll('.genre-chip').forEach((b, i) => b.classList.toggle('active', i === 0));
      switchTab('catalog');
      resetAndFetchCatalog();
    }

    function goBackFromWatch() {
      switchTab('catalog', false);
      if (currentCatalogMode === 'manga') renderMangaGrid(state.animes);
      else renderGrid(state.animes, 'animeGrid', false);
    }

    function renderHistoryTab() {
      const grid = document.getElementById('historyGrid');
      const list = [...state.history, ...state.mangaHistory];
      if (!list.length) {
        grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--color-variant); text-align:center;">История пуста.</p>`;
        return;
      }
      grid.innerHTML = '';
      list.forEach(item => {
        state.itemsRegistry[String(item.id)] = item;
        const fn = item.isManga ? `openMangaReader('${item.id}')` : `handleCardClick('${item.id}')`;
        grid.innerHTML += `
          <article class="anime-card animate-fade" onclick="${fn}">
            <div class="poster-wrap">
              <img src="${item.poster}" loading="lazy" />
              <div class="card-badges"><span class="badge-pill">${item.isManga ? 'Манга' : 'Аниме'}</span></div>
            </div>
            <div class="card-body">
              <h3 class="card-title">${item.titleRu}</h3>
              <div class="card-meta">${item.year}</div>
            </div>
          </article>
        `;
      });
    }

    function clearLocalHistory() {
      state.history = [];
      state.mangaHistory = [];
      localStorage.removeItem('kodik_history');
      localStorage.removeItem('komboko_manga_history');
      renderHistoryTab();
      renderContinueWatchingBlock();
    }

    function handleAuthLogoClick() {
      const token = localStorage.getItem('shiki_token');
      if (!token) {
        const redirectUri = window.location.origin + window.location.pathname;
        window.location.href = `https://shikimori.io/oauth/authorize?client_id=${SHIKI_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code`;
      } else {
        switchTab('lists');
      }
    }

    function switchTab(tab, save = true) {
      state.currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(`nav-${tab}`)?.classList.add('active');

      ['view-catalog', 'view-watch', 'view-manga-reader', 'view-lists', 'view-history'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });

      const topBar = document.querySelector('.top-bar');
      const genresBar = document.getElementById('genresBar');
      if (topBar) topBar.style.display = (tab === 'catalog') ? 'flex' : 'none';
      if (genresBar) genresBar.style.display = (tab === 'catalog' && currentCatalogMode === 'anime') ? 'flex' : 'none';

      if (tab === 'watch') document.getElementById('view-watch').style.display = 'block';
      else if (tab === 'manga-reader') document.getElementById('view-manga-reader').style.display = 'block';
      else if (tab === 'lists') {
        document.getElementById('view-lists').style.display = 'block';
        fetchUserRatesList('watching');
      } else if (tab === 'history') {
        document.getElementById('view-history').style.display = 'block';
        renderHistoryTab();
      } else {
        document.getElementById('view-catalog').style.display = 'block';
        renderContinueWatchingBlock();
      }
    }

    function setLanguage(lang) {
      document.getElementById('langRu').classList.toggle('active', lang === 'ru');
      document.getElementById('langEn').classList.toggle('active', lang === 'en');
    }
  </script>
