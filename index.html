<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KombokoWatch — Liquid Glass</title>

  <!-- Иконки и PWA теги -->
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">

  <!-- Google Fonts: Comfortaa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Symbols Font -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

  <style>
    :root {
      --glass-bg: rgba(18, 15, 28, 0.65);
      --glass-surface: rgba(32, 26, 48, 0.45);
      --glass-surface-high: rgba(50, 40, 75, 0.55);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-glow: rgba(208, 188, 255, 0.35);
      
      --color-primary: #D0BCFF;
      --color-on-primary: #381E72;
      --color-primary-container: #4F378B;
      --color-on-primary-container: #EADDFF;
      --color-surface: #E6E0E9;
      --color-variant: #CAC4D0;

      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-full: 9999px;
      --bottom-nav-height: 76px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Comfortaa', cursive, sans-serif;
    }

    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      vertical-align: middle;
    }
    .material-symbols-rounded.filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    body {
      background-color: #08060f;
      color: var(--color-surface);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
      position: relative;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.35;
      animation: floatOrbs 12s ease-in-out infinite alternate;
    }
    body::before { top: -150px; left: -150px; background: rgba(115, 74, 186, 0.6); }
    body::after { bottom: -150px; right: -150px; background: rgba(85, 30, 130, 0.7); animation-delay: -6s; }

    @keyframes floatOrbs {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(40px) scale(1.1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Навигация (Сайдбар на ПК) */
    .nav-rail {
      width: 92px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      gap: 24px;
      box-shadow: 15px 0 40px rgba(0, 0, 0, 0.4);
    }

    .header-profile-btn {
      width: 50px;
      height: 50px;
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(208, 188, 255, 0.25);
      border: 2px solid var(--color-primary);
      background: rgba(208, 188, 255, 0.15);
      color: var(--color-primary);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
      flex-shrink: 0;
    }
    .header-profile-btn:hover {
      transform: scale(1.08);
      background: rgba(208, 188, 255, 0.25);
    }
    .header-profile-btn img { width: 100%; height: 100%; object-fit: cover; }

    .nav-items {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--color-variant);
      cursor: pointer;
      width: 100%;
      font-size: 11px;
      transition: color 0.2s;
    }

    .nav-pill {
      width: 60px;
      height: 36px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-item:hover { color: var(--color-surface); }
    .nav-item:hover .nav-pill { background: rgba(255, 255, 255, 0.05); }

    .nav-item.active { color: var(--color-primary); }
    .nav-item.active .nav-pill {
      background: rgba(208, 188, 255, 0.2);
      box-shadow: inset 0 0 0 1.5px rgba(208, 188, 255, 0.4), 0 4px 15px rgba(208, 188, 255, 0.2);
    }
    .nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1; }

    .app-main {
      flex: 1;
      margin-left: 92px;
      padding: 24px 36px 56px;
      width: calc(100% - 92px);
    }

    .app-header-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand-title-text {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #D0BCFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 25px rgba(208, 188, 255, 0.25);
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .search-container {
      flex: 1;
      min-width: 280px;
      display: flex;
      align-items: center;
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-full);
      padding: 6px 12px 6px 20px;
      height: 56px;
      gap: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-container:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 10px 40px rgba(208, 188, 255, 0.2), inset 0 0 0 1.5px rgba(208, 188, 255, 0.3);
      transform: translateY(-2px);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--color-surface);
      font-size: 15px;
    }
    .search-input::placeholder { color: var(--color-variant); opacity: 0.7; }

    .md-btn {
      height: 44px;
      padding: 0 24px;
      border-radius: var(--radius-full);
      border: none;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .md-btn:hover { transform: scale(1.04); }
    .md-btn:active { transform: scale(0.96); }

    .md-btn-filled {
      background: linear-gradient(135deg, #D0BCFF 0%, #b39ddb 100%);
      color: var(--color-on-primary);
      box-shadow: 0 6px 20px rgba(208, 188, 255, 0.35);
    }

    .md-btn-tonal {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--color-surface);
    }
    .md-btn-tonal:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--glass-border-glow); }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    .anime-card {
      background: var(--glass-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .anime-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--glass-border-glow);
      box-shadow: 0 16px 50px rgba(208, 188, 255, 0.2);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 2.85;
      background: rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .anime-card:hover .poster-wrap img { transform: scale(1.06); }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background: linear-gradient(135deg, #2b1f45 0%, #151122 100%);
      color: var(--color-primary);
      gap: 8px;
    }
    .poster-fallback span.material-symbols-rounded { font-size: 38px; opacity: 0.8; }
    .poster-fallback p { font-size: 13px; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

    .card-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 2;
    }

    .badge-pill {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      background: rgba(12, 9, 20, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--color-surface);
    }
    .badge-pill.rating { color: #FFD54F; }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 12px;
      color: var(--color-variant);
      margin-bottom: 6px;
    }

    .card-add-wrapper {
      position: relative;
      margin-top: auto;
    }
    .card-add-btn {
      width: 100%;
      height: 34px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--color-surface);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card-add-btn:hover {
      background: rgba(208, 188, 255, 0.15);
      border-color: var(--glass-border-glow);
      color: var(--color-primary);
    }

    .status-dropdown {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      background: rgba(24, 20, 35, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border-glow);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      animation: fadeIn 0.2s ease;
    }
    .status-option {
      padding: 9px 12px;
      font-size: 11px;
      color: var(--color-surface);
      cursor: pointer;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      text-align: left;
      font-family: inherit;
    }
    .status-option:hover {
      background: rgba(208, 188, 255, 0.2);
      color: var(--color-primary);
    }

    .watch-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
      align-items: start;
    }

    .player-card {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
    }

    .video-stage {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    .video-stage iframe { width: 100%; height: 100%; border: none; display: block; }

    .player-toolbar {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 12, 22, 0.7);
      border-top: 1px solid var(--glass-border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .sidebar-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .voice-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 200px; overflow-y: auto; }
    .voice-chip {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      color: var(--color-surface);
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      transition: all 0.2s;
    }
    .voice-chip:hover { background: rgba(255, 255, 255, 0.08); }
    .voice-chip.active { background: rgba(208, 188, 255, 0.2); border-color: var(--glass-border-glow); color: var(--color-primary); box-shadow: 0 0 15px rgba(208, 188, 255, 0.2); }

    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; }
    .ep-btn {
      height: 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--color-surface);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ep-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
    .ep-btn.active { background: var(--color-primary); color: var(--color-on-primary); border-color: transparent; box-shadow: 0 0 20px rgba(208, 188, 255, 0.4); }

    .anime-details-box {
      margin-top: 20px;
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.4);
    }
    .details-top { display: flex; gap: 20px; align-items: start; }
    
    /* Контейнер постера с защитой от схлопывания */
    .details-poster-wrap {
      width: 135px;
      height: 195px;
      flex-shrink: 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      background: rgba(0,0,0,0.3);
    }
    .details-poster { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block;
    }
    .details-poster-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      background: linear-gradient(135deg, #2b1f45 0%, #151122 100%);
      color: var(--color-primary);
      gap: 6px;
    }
    .details-poster-fallback span.material-symbols-rounded { font-size: 28px; opacity: 0.8; }
    .details-poster-fallback p { font-size: 11px; font-weight: 700; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

    .shiki-status-container {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shiki-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border-glow);
      color: var(--color-surface);
      padding: 8px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .shiki-select option { background: #18151c; color: var(--color-surface); }

    .relations-section { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .relations-title { font-size: 14px; font-weight: 600; color: var(--color-primary); }
    .relations-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .relation-card {
      min-width: 110px; max-width: 110px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 6px; cursor: pointer;
      display: flex; flex-direction: column; gap: 4px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .relation-card:hover { transform: translateY(-3px); border-color: var(--glass-border-glow); }
    .relation-img { width: 100%; aspect-ratio: 2/2.8; object-fit: cover; border-radius: 8px; }
    .relation-name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .relation-type { font-size: 9px; color: var(--color-variant); }

    .characters-section { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
    .characters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; }
    .character-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 8px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .character-card:hover { transform: translateY(-4px); border-color: var(--glass-border-glow); background: rgba(255, 255, 255, 0.06); }
    .character-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--glass-border-glow); }
    .character-name { font-size: 11px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; }

    .character-view-box {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
      display: flex; gap: 24px; align-items: start;
    }
    .character-view-avatar {
      width: 200px; border-radius: var(--radius-md); object-fit: cover;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--glass-border-glow); flex-shrink: 0;
    }
    .character-view-info { display: flex; flex-direction: column; gap: 12px; }
    .character-view-title { font-size: 24px; font-weight: 700; color: var(--color-primary); }
    .character-view-subtitle { font-size: 14px; color: var(--color-variant); font-style: italic; }
    .character-view-desc { font-size: 14px; line-height: 1.6; color: var(--color-surface); white-space: pre-line; }

    .loader-box {
      grid-column: 1 / -1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px; gap: 16px; color: var(--color-variant); text-align: center;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .nav-rail {
        top: auto !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        height: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom)) !important;
        padding: 6px 8px env(safe-area-inset-bottom) !important;
        flex-direction: row !important;

</head>
<body>

  <!-- Навигация (Сайдбар на ПК) -->

    <!-- Плеер -->
    <section id="view-watch" style="display: none;">

        <h2 class="section-title" id="watchTitle" style="flex:1; margin-left: 12px; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Тайтл</h2>

          <button class="md-btn md-btn-tonal" onclick="fetchUserRatesList('watching')">Смотрю</button>
          <button class="md-btn md-btn-tonal" onclick="fetchUserRatesList('planned')">В планах</button>
          <button class="md-btn md-btn-tonal" onclick="fetchUserRatesList('completed')">Просмотрено</button>
          <button class="md-btn md-btn-tonal" onclick="fetchUserRatesList('dropped')">Бросил</button>
        </div>
      </div>
      <div class="anime-grid" id="userListsGrid"></div>

    <!-- Страница персонажа -->
    <section id="view-character" style="display: none;">
      <div class="section-header">
        <button class="md-btn md-btn-tonal" onclick="switchTab('watch')">
          <span class="material-symbols-rounded">arrow_back</span> К аниме
        </button>
        <h2 class="section-title" style="flex:1; margin-left: 12px; font-size:16px;">Информация о персонаже</h2>
      </div>

      <div id="characterContent" class="loader-box">
        <div class="spinner"></div>
        <span>Загружаем данные персонажа...</span>
      </div>
    </section>
  </main>

  <script>
    const KODIK_TOKEN = '447d179e875efe44217f20d1ee2146be';
    const BACKEND_URL = 'https://komboko-adblock.onrender.com';
    const SHIKI_CLIENT_ID = '2gnAwexNcV7ENj62zeIAvBI9q7c63O9z5mWSR6k5oRo';

    let state = {
      animes: [],
      currentAnimeFull: null,
      currentVariantIndex: 0,
      currentEpisodeNum: 1,
      currentUser: null,
      userRates: {},
      history: JSON.parse(localStorage.getItem('kodik_history') || '[]')
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (code) {
        window.history.replaceState({}, document.title, window.location.pathname);
        try {
          const redirectUri = window.location.origin + window.location.pathname;
          const res = await fetch(`${BACKEND_URL}/api/shikimori_auth`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, redirect_uri: redirectUri })
          });
          const tokenData = await res.json();
          if (tokenData.access_token) {
            localStorage.setItem('shiki_token', tokenData.access_token);
            await fetchUserProfile(tokenData.access_token);
          }
        } catch (err) {
          console.error('Auth error:', err);
        }
      } else {
        const savedToken = localStorage.getItem('shiki_token');
        if (savedToken) await fetchUserProfile(savedToken);
      }

      fetchShikimoriCatalog();
    });

    function redirectToShikimoriLogin() {
      const redirectUri = window.location.origin + window.location.pathname;
      window.location.href = `https://shikimori.io/oauth/authorize?client_id=${SHIKI_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code`;
    }

    function handleAuthLogoClick() {
      const token = localStorage.getItem('shiki_token');
      if (!token) {
        redirectToShikimoriLogin();
      } else {
        switchTab('lists');
        fetchUserRatesList('watching');
      }
    }

    async function fetchUserProfile(token) {
      try {
        const res = await fetch('https://shikimori.io/api/users/whoami', {
          headers: {
            'User-Agent': 'KombokoWatchApp',
            'Authorization': `Bearer ${token}`
          }
        });
        const user = await res.json();
        if (user && user.id) {
          state.currentUser = user;
          const avatar = user.image ? (user.image.x160 || user.image.x48) : 'https://shikimori.io/favicons/apple-touch-icon-180x180.png';
          
          ['sidebarAuthLogo', 'headerAuthLogo'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
              el.innerHTML = `<img src="${avatar}" alt="${user.nickname}" />`;
              el.title = `Вы вошли как ${user.nickname}. Нажмите, чтобы открыть списки (ПКМ для выхода)`;
              el.oncontextmenu = (e) => {
                e.preventDefault();
                if (confirm('Выйти из аккаунта Shikimori?')) {
                  localStorage.removeItem('shiki_token');
                  location.reload();
                }
              };
            }
          });

          fetchAllUserRates(user.id, token);
        }
      } catch (_) {
        localStorage.removeItem('shiki_token');
      }
    }

    async function fetchAllUserRates(userId, token) {
      try {
        const res = await fetch(`https://shikimori.io/api/v2/user_rates?user_id=${userId}&target_type=Anime`, {
          headers: {
            'User-Agent': 'KombokoWatchApp',
            'Authorization': `Bearer ${token}`
          }
        });
        const rates = await res.json();
        if (Array.isArray(rates)) {
          state.userRates = {};
          rates.forEach(r => {
            state.userRates[r.target_id] = r;
          });
        }
      } catch (_) {}
    }

    async function fetchUserRatesList(statusFilter) {
      const grid = document.getElementById('userListsGrid');
      const filtersBar = document.getElementById('listFilters');
      const token = localStorage.getItem('shiki_token');

      if (!token || !state.currentUser) {
        filtersBar.style.display = 'none';
        grid.innerHTML = `
          <div class="loader-box" style="gap: 16px; grid-column: 1/-1;">
            <p style="color: var(--color-surface); font-size: 15px; text-align: center;">Чтобы получить доступ к своим спискам, выполните вход в аккаунт Shikimori!</p>
            <button class="md-btn md-btn-filled" onclick="redirectToShikimoriLogin()">Войти</button>
          </div>
        `;
        return;
      }

      filtersBar.style.display = 'flex';
      grid.innerHTML = `
        <div class="loader-box">
          <div class="spinner"></div>
          <span>Загружаем список...</span>
        </div>
      `;

      try {
        const res = await fetch(`https://shikimori.io/api/v2/user_rates?user_id=${state.currentUser.id}&status=${statusFilter}&target_type=Anime`, {
          headers: {
            'User-Agent': 'KombokoWatchApp',
            'Authorization': `Bearer ${token}`
          }
        });
        const rates = await res.json();
        
        if (Array.isArray(rates) && rates.length > 0) {
          const animeIds = rates.map(r => r.target_id).join(',');
          const animesRes = await fetch(`https://shikimori.io/api/animes?ids=${animeIds}&limit=50`);
          const animesData = await animesRes.json();

          const listItems = animesData.map(item => {
            let poster = null;
            if (item.image) {
              const rawImg = item.image.original || item.image.preview;
              if (rawImg && !rawImg.includes('missing')) {
                poster = rawImg.startsWith('http') ? rawImg : `https://shikimori.io${rawImg}`;
              }
            }
            return {
              id: String(item.id),
              title: item.russian || item.name || 'Без названия',
              year: item.aired_on ? item.aired_on.slice(0, 4) : '2024',
              episodes: item.episodes || item.episodes_aired || 12,
              rating: item.score && item.score !== '0.0' ? item.score : null,
              poster,
              description: (item.description || 'Описание отсутствует.').replace(/\[.*?\]/g, ''),
              genres: (item.genres || []).map(g => g.russian),
              status: item.status === 'ongoing' ? 'Онгоинг' : 'Вышел'
            };
          });

          renderGrid(listItems, 'userListsGrid');
        } else {
          grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--color-variant); text-align:center;">В этом списке пока ничего нет.</p>`;
        }
      } catch (err) {
        grid.innerHTML = `<p style="grid-column:1/-1; color:#F2B8B5; text-align:center;">Не удалось загрузить списки.</p>`;
      }
    }

    function handleCardAddClick(e, animeId) {
      e.stopPropagation();
      const token = localStorage.getItem('shiki_token');
      if (!token) {
        redirectToShikimoriLogin();
        return;
      }

      document.querySelectorAll('.status-dropdown').forEach(el => el.remove());

      const wrapper = e.currentTarget.parentElement;
      const dropdown = document.createElement('div');
      dropdown.className = 'status-dropdown';

      const statuses = [
        { key: 'watching', label: 'Смотрю' },
        { key: 'planned', label: 'В планах' },
        { key: 'completed', label: 'Просмотрено' },
        { key: 'on_hold', label: 'Отложено' },
        { key: 'dropped', label: 'Брошено' },
        { key: '', label: 'Убрать из списка' }
      ];

      statuses.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'status-option';
        btn.textContent = s.label;
        btn.onclick = async (ev) => {
          ev.stopPropagation();
          dropdown.remove();
          await setAnimeStatusDirect(animeId, s.key);
        };
        dropdown.appendChild(btn);
      });

      wrapper.appendChild(dropdown);

      const closeListener = (ev) => {
        if (!wrapper.contains(ev.target)) {
          dropdown.remove();
          document.removeEventListener('click', closeListener);
        }
      };
      setTimeout(() => document.addEventListener('click', closeListener), 10);
    }

    function openPlayerListDropdown(e) {
      const token = localStorage.getItem('shiki_token');
      if (!token) {
        redirectToShikimoriLogin();
        return;
      }
      if (!state.currentAnimeFull) return;

      document.querySelectorAll('.status-dropdown').forEach(el => el.remove());

      const btnTarget = e.currentTarget;
      const dropdown = document.createElement('div');
      dropdown.className = 'status-dropdown';
      dropdown.style.bottom = 'auto';
      dropdown.style.top = '48px';
      dropdown.style.right = '0';
      dropdown.style.left = 'auto';
      dropdown.style.width = '160px';

      const statuses = [
        { key: 'watching', label: 'Смотрю' },
        { key: 'planned', label: 'В планах' },
        { key: 'completed', label: 'Просмотрено' },
        { key: 'on_hold', label: 'Отложено' },
        { key: 'dropped', label: 'Брошено' },
        { key: '', label: 'Убрать из списка' }
      ];

      statuses.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'status-option';
        btn.textContent = s.label;
        btn.onclick = async (ev) => {
          ev.stopPropagation();
          dropdown.remove();
          await setAnimeStatusDirect(state.currentAnimeFull.id, s.key);
          document.getElementById('shikiStatusSelect').value = s.key;
        };
        dropdown.appendChild(btn);
      });

      btnTarget.style.position = 'relative';
      btnTarget.appendChild(dropdown);

      const closeListener = (ev) => {
        if (!btnTarget.contains(ev.target)) {
          dropdown.remove();
          document.removeEventListener('click', closeListener);
        }
      };
      setTimeout(() => document.addEventListener('click', closeListener), 10);
    }

    async function setAnimeStatusDirect(animeId, status) {
      const token = localStorage.getItem('shiki_token');
      if (!token || !state.currentUser) return;

      const existingRate = state.userRates[animeId];
      try {
        if (!status) {
          if (existingRate) {
            await fetch(`https://shikimori.io/api/v2/user_rates/${existingRate.id}`, {
              method: 'DELETE',
              headers: { 'User-Agent': 'KombokoWatchApp', 'Authorization': `Bearer ${token}` }
            });
            delete state.userRates[animeId];
            alert('Удалено из списков Shikimori');
          }
          return;
        }

        if (existingRate) {
          const res = await fetch(`https://shikimori.io/api/v2/user_rates/${existingRate.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'User-Agent': 'KombokoWatchApp', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ user_rate: { status } })
          });
          const updated = await res.json();
          state.userRates[animeId] = updated;
        } else {
          const res = await fetch(`https://shikimori.io/api/v2/user_rates`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'User-Agent': 'KombokoWatchApp', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({
              user_rate: { status, target_id: animeId, target_type: 'Anime', user_id: state.currentUser.id }
            })
          });
          const created = await res.json();
          state.userRates[animeId] = created;
        }
        alert('Статус на Shikimori успешно обновлен!');
      } catch (err) {
        alert('Ошибка при обновлении списка.');
      }
    }

    async function updateUserAnimeStatus(newStatus) {
      if (state.currentAnimeFull) {
        await setAnimeStatusDirect(state.currentAnimeFull.id, newStatus);
      }
    }

    async function fetchShikimoriCatalog(query = '') {
      const grid = document.getElementById('animeGrid');
      grid.innerHTML = `
        <div class="loader-box">
          <div class="spinner"></div>
          <span>Загружаем баннеры и описания...</span>
        </div>
      `;

      try {
        let url = 'https://shikimori.io/api/animes?limit=36&order=popularity';
        if (query) {
          if (/^\d+$/.test(query)) {
            url = `https://shikimori.io/api/animes/${query}`;
          } else {
            url = `https://shikimori.io/api/animes?search=${encodeURIComponent(query)}&limit=36`;
          }
        }

        const res = await fetch(url);
        const data = await res.json();
        const items = Array.isArray(data) ? data : [data];

        state.animes = items.filter(Boolean).map(item => {
          let poster = null;
          if (item.image) {
            const rawImg = item.image.original || item.image.preview || item.image.x96;
            if (rawImg && !rawImg.includes('missing')) {
              poster = rawImg.startsWith('http') ? rawImg : `https://shikimori.io${rawImg}`;
            }
          }

          return {
            id: String(item.id),
            title: item.russian || item.name || 'Без названия',
            year: item.aired_on ? item.aired_on.slice(0, 4) : '2024',
            episodes: item.episodes || item.episodes_aired || 12,
            rating: item.score && item.score !== '0.0' ? item.score : null,
            poster,
            description: (item.description || 'Описание отсутствует.').replace(/\[.*?\]/g, ''),
            genres: (item.genres || []).map(g => g.russian),
            status: item.status === 'ongoing' ? 'Онгоинг' : 'Вышел'
          };
        });

        renderGrid(state.animes, 'animeGrid');
      } catch (err) {
        grid.innerHTML = `<p style="grid-column:1/-1; color:#F2B8B5; text-align:center;">Не удалось загрузить каталог с Shikimori.</p>`;
      }
    }

    function renderGrid(list, elementId = 'animeGrid') {
      const grid = document.getElementById(elementId);
      grid.innerHTML = '';

      if (!list || list.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--color-variant); text-align:center;">Ничего не найдено.</p>`;
        return;
      }

      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'anime-card animate-fade';
        card.onclick = () => loadKodikPlayerForAnime(item);

        const posterInner = item.poster 
          ? `<img src="${item.poster}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'poster-fallback\\'><span class=\\'material-symbols-rounded\\'>movie</span><p>${item.title}</p></div>'" />`
          : `<div class="poster-fallback"><span class="material-symbols-rounded">movie</span><p>${item.title}</p></div>`;

        card.innerHTML = `
          <div class="poster-wrap">
            ${posterInner}
            <div class="card-badges">
              ${item.rating ? `<span class="badge-pill rating">★ ${item.rating}</span>` : `<span></span>`}
              <span class="badge-pill">${item.episodes} эп.</span>
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-title">${item.title}</h3>
            <div class="card-meta">${item.year}</div>
            <div class="card-add-wrapper">
              <button class="card-add-btn" onclick="handleCardAddClick(event, '${item.id}')">
                <span class="material-symbols-rounded" style="font-size:16px;">bookmark_add</span> В список
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderDetailsPoster(posterUrl, title) {
      const wrap = document.getElementById('detailsPosterWrap');
      if (posterUrl && !posterUrl.includes('missing')) {
        wrap.innerHTML = `<img class="details-poster" src="${posterUrl}" alt="Poster" onerror="this.parentElement.innerHTML='<div class=\\'details-poster-fallback\\'><span class=\\'material-symbols-rounded\\'>movie</span><p>${title}</p></div>'" />`;
      } else {
        wrap.innerHTML = `<div class="details-poster-fallback"><span class="material-symbols-rounded">movie</span><p>${title}</p></div>`;
      }
    }

    async function loadKodikPlayerForAnime(item) {
      switchTab('watch');
      
      document.getElementById('watchTitle').textContent = item.title;
      renderDetailsPoster(item.poster, item.title);

      document.getElementById('detailsMeta').textContent = 'Загрузка информации...';
      document.getElementById('detailsDesc').textContent = 'Загрузка полного описания...';
      document.getElementById('shikiStatusContainer').style.display = 'none';
      
      document.getElementById('relationsSection').style.display = 'none';
      document.getElementById('charactersSection').style.display = 'none';

      let detailedItem = item;
      try {
        const detailRes = await fetch(`https://shikimori.io/api/animes/${item.id}`);
        const detailData = await detailRes.json();
        if (detailData && detailData.id) {
          let poster = item.poster;
          if (detailData.image) {
            const rawImg = detailData.image.original || detailData.image.preview;
            if (rawImg && !rawImg.includes('missing')) {
              poster = rawImg.startsWith('http') ? rawImg : `https://shikimori.io${rawImg}`;
            }
          }
          detailedItem = {
            ...item,
            title: detailData.russian || detailData.name || item.title,
            poster,
            description: (detailData.description || 'Описание отсутствует.').replace(/\[.*?\]/g, ''),
            genres: (detailData.genres || []).map(g => g.russian),
            status: detailData.status === 'ongoing' ? 'Онгоинг' : 'Вышел',
            year: detailData.aired_on ? detailData.aired_on.slice(0, 4) : item.year
          };
        }
      } catch (_) {}

      document.getElementById('watchTitle').textContent = detailedItem.title;
      renderDetailsPoster(detailedItem.poster, detailedItem.title);

      document.getElementById('detailsMeta').textContent = [detailedItem.year, detailedItem.status, ...(detailedItem.genres || []).slice(0, 3)].filter(Boolean).join(' • ');
      document.getElementById('detailsDesc').textContent = detailedItem.description;

      const token = localStorage.getItem('shiki_token');
      if (token) {
        const select = document.getElementById('shikiStatusSelect');
        const rate = state.userRates[detailedItem.id];
        select.value = rate ? rate.status : '';
        document.getElementById('shikiStatusContainer').style.display = 'flex';
      }

      loadAnimeRelations(detailedItem.id);
      loadAnimeCharacters(detailedItem.id);

      const apiUrl = `https://kodikapi.com/search?token=${KODIK_TOKEN}&shikimori_id=${detailedItem.id}&with_episodes=true&with_material_data=true`;
      
      let kodikResults = [];
      try {
        const proxyRes = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`);
        const data = await proxyRes.json();
        if (data && data.results) kodikResults = data.results;
      } catch (_) {}

      state.currentAnimeFull = parseKodikVariants(detailedItem, kodikResults);
      state.currentVariantIndex = 0;
      state.currentEpisodeNum = 1;

      state.history = [detailedItem, ...state.history.filter(a => a.id !== detailedItem.id)].slice(0, 30);
      localStorage.setItem('kodik_history', JSON.stringify(state.history));

      renderVoiceChips();
      renderEpisodesGrid();
      loadCurrentEpisodeVideo();
    }

    async function loadAnimeRelations(animeId) {
      const section = document.getElementById('relationsSection');
      const list = document.getElementById('relationsList');
      list.innerHTML = '';
      section.style.display = 'none';

      try {
        const res = await fetch(`https://shikimori.io/api/animes/${animeId}/related`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          const relationNames = {
            sequel: 'Сиквел',
            prequel: 'Приквел',
            side: 'Спин-офф',
            parent: 'Родитель',
            summary: 'Итог',
            alternative_setting: 'Альтернатива'
          };

          let html = '';
          data.forEach(rel => {
            if (!rel.anime) return;
            const a = rel.anime;
            const relType = relationNames[rel.relation] || rel.relation;
            let img = 'https://shikimori.io/favicons/apple-touch-icon-180x180.png';
            if (a.image) {
              const r = a.image.preview || a.image.original;
              if (r && !r.includes('missing')) img = r.startsWith('http') ? r : `https://shikimori.io${r}`;
            }
            const name = a.russian || a.name || 'Часть';
            
            html += `
              <div class="relation-card" onclick="loadRelatedAnime('${a.id}')">
                <img class="relation-img" src="${img}" loading="lazy" />
                <div class="relation-type">${relType}</div>
                <div class="relation-name" title="${name}">${name}</div>
              </div>
            `;
          });

          if (html) {
            list.innerHTML = html;
            section.style.display = 'block';
          }
        }
      } catch (_) {}
    }

    async function loadRelatedAnime(id) {
      try {
        const res = await fetch(`https://shikimori.io/api/animes/${id}`);
        const item = await res.json();
        if (item && item.id) {
          let poster = null;
          if (item.image) {
            const rawImg = item.image.original || item.image.preview;
            if (rawImg && !rawImg.includes('missing')) poster = rawImg.startsWith('http') ? rawImg : `https://shikimori.io${rawImg}`;
          }
          loadKodikPlayerForAnime({
            id: String(item.id),
            title: item.russian || item.name || 'Без названия',
            year: item.aired_on ? item.aired_on.slice(0, 4) : '2024',
            episodes: item.episodes || item.episodes_aired || 12,
            rating: item.score && item.score !== '0.0' ? item.score : null,
            poster,
            description: (item.description || 'Описание отсутствует.').replace(/\[.*?\]/g, ''),
            genres: (item.genres || []).map(g => g.russian),
            status: item.status === 'ongoing' ? 'Онгоинг' : 'Вышел'
          });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch (_) {}
    }

    async function loadAnimeCharacters(animeId) {
      const section = document.getElementById('charactersSection');
      const grid = document.getElementById('charactersGrid');
      grid.innerHTML = '';
      section.style.display = 'none';

      try {
        const res = await fetch(`https://shikimori.io/api/animes/${animeId}/characters`);
        const data = await res.json();
        if (Array.isArray(data)) {
          const mainChars = data.filter(c => c.role === 'Main').map(c => c.character).filter(Boolean);

          let html = '';
          mainChars.forEach(char => {
            let img = 'https://shikimori.io/favicons/apple-touch-icon-180x180.png';
            if (char.image) {
              const r = char.image.preview || char.image.original;
              if (r && !r.includes('missing')) img = r.startsWith('http') ? r : `https://shikimori.io${r}`;
            }
            const name = char.russian || char.name || 'Герой';

            html += `
              <div class="character-card" onclick="openCharacterDetails('${char.id}')">
                <img class="character-avatar" src="${img}" loading="lazy" />
                <div class="character-name" title="${name}">${name}</div>
              </div>
            `;
          });

          if (html) {
            grid.innerHTML = html;
            section.style.display = 'block';
          }
        }
      } catch (_) {}
    }

    async function openCharacterDetails(charId) {
      switchTab('character');
      const container = document.getElementById('characterContent');
      container.className = 'loader-box';
      container.innerHTML = `
        <div class="spinner"></div>
        <span>Загружаем информацию о персонаже...</span>
      `;

      try {
        const res = await fetch(`https://shikimori.io/api/characters/${charId}`);
        const char = await res.json();
        if (char && char.id) {
          let img = 'https://shikimori.io/favicons/apple-touch-icon-180x180.png';
          if (char.image) {
            const r = char.image.original || char.image.preview;
            if (r && !r.includes('missing')) img = r.startsWith('http') ? r : `https://shikimori.io${r}`;
          }
          const name = char.russian || char.name || 'Персонаж';
          const japanese = char.japanese ? `(${char.japanese})` : '';
          const desc = (char.description || 'Описание персонажа отсутствует.').replace(/\[.*?\]/g, '');

          container.className = '';
          container.innerHTML = `
            <div class="character-view-box animate-fade">
              <img class="character-view-avatar" src="${img}" alt="${name}" />
              <div class="character-view-info">
                <div class="character-view-title">${name}</div>
                <div class="character-view-subtitle">${japanese}</div>
                <div class="character-view-desc">${desc}</div>
              </div>
            </div>
          `;
        } else {
          throw new Error();
        }
      } catch (_) {
        container.className = 'loader-box';
        container.innerHTML = `<p style="color: #F2B8B5;">Не удалось загрузить информацию о персонаже.</p>`;
      }
    }

    function parseKodikVariants(baseItem, results) {
      const variants = [];
      for (const r of results) {
        const translation = r.translation || { id: 0, title: 'Оригинал', type: 'voice' };
        const episodes = {};
        if (r.seasons) {
          for (const sKey of Object.keys(r.seasons)) {
            const seasonObj = r.seasons[sKey];
            if (seasonObj && seasonObj.episodes) {
              for (const [epNum, epData] of Object.entries(seasonObj.episodes)) {
                episodes[epNum] = typeof epData === 'string' ? epData : epData.link;
              }
            }
          }
        }
        if (Object.keys(episodes).length === 0 && r.link) {
          episodes['1'] = r.link;
        }

        if (Object.keys(episodes).length > 0) {
          variants.push({
            translation,
            default_link: r.link,
            episodes
          });
        }
      }

      if (variants.length === 0) {
        const episodes = {};
        for (let i = 1; i <= (baseItem.episodes || 12); i++) {
          episodes[String(i)] = `https://kodik.info/find-player?shikimoriID=${baseItem.id}&episode=${i}`;
        }
        variants.push({
          translation: { id: 0, title: 'Основная озвучка Kodik', type: 'voice' },
          default_link: `https://kodik.info/find-player?shikimoriID=${baseItem.id}`,
          episodes
        });
      }

      return { ...baseItem, variants };
    }

    function renderVoiceChips() {
      const container = document.getElementById('voiceList');
      container.innerHTML = '';
      const variants = state.currentAnimeFull.variants;
      document.getElementById('voicesCount').textContent = variants.length;

      variants.forEach((v, idx) => {
        const btn = document.createElement('button');
        btn.className = `voice-chip ${idx === state.currentVariantIndex ? 'active' : ''}`;
        btn.textContent = v.translation.title;
        btn.onclick = () => {
          state.currentVariantIndex = idx;
          renderVoiceChips();
          renderEpisodesGrid();
          loadCurrentEpisodeVideo();
        };
        container.appendChild(btn);
      });
    }

    function renderEpisodesGrid() {
      const grid = document.getElementById('episodesGrid');
      grid.innerHTML = '';
      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      if (!variant) return;

      const epNumbers = Object.keys(variant.episodes).sort((a, b) => Number(a) - Number(b));
      
      epNumbers.forEach((epStr) => {
        const epNum = Number(epStr);
        const btn = document.createElement('button');
        btn.className = `ep-btn ${epNum === state.currentEpisodeNum ? 'active' : ''}`;
        btn.textContent = epNum;
        btn.onclick = () => {
          state.currentEpisodeNum = epNum;
          renderEpisodesGrid();
          loadCurrentEpisodeVideo();
        };
        grid.appendChild(btn);
      });
    }

    function loadCurrentEpisodeVideo() {
      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      if (!variant) return;

      const epNum = state.currentEpisodeNum;
      const rawLink = variant.episodes[String(epNum)] || variant.default_link;
      let cleanUrl = rawLink.startsWith('//') ? `https:${rawLink}` : rawLink;

      cleanUrl = cleanUrl
        .replace('kodik.info', 'kodikplayer.com')
        .replace('cloud.kodik-storage.com', 'cloud.kodikplayer.com');

      document.getElementById('currentEpLabel').textContent = `Серия ${epNum}`;
      document.getElementById('openInNewTab').href = cleanUrl;
      document.getElementById('kodikIframe').src = cleanUrl;
    }

    function stepEpisode(delta) {
      if (!state.currentAnimeFull) return;
      const variant = state.currentAnimeFull.variants[state.currentVariantIndex];
      const target = state.currentEpisodeNum + delta;
      if (variant.episodes[String(target)]) {
        state.currentEpisodeNum = target;
        renderEpisodesGrid();
        loadCurrentEpisodeVideo();
      }
    }

    function handleSearchSubmit(e) {
      e.preventDefault();
      const raw = document.getElementById('searchInput').value.trim();
      if (!raw) {
        fetchShikimoriCatalog();
        return;
      }
      fetchShikimoriCatalog(raw);
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      const navBtn = document.getElementById(`nav-${tab}`);
      if (navBtn) navBtn.classList.add('active');

      const catalogView = document.getElementById('view-catalog');
      const watchView = document.getElementById('view-watch');
      const characterView = document.getElementById('view-character');
      const listsView = document.getElementById('view-lists');

      catalogView.style.display = 'none';
      watchView.style.display = 'none';
      characterView.style.display = 'none';
      listsView.style.display = 'none';

      if (tab === 'watch') {
        watchView.style.display = 'block';
      } else if (tab === 'character') {
        characterView.style.display = 'block';
      } else if (tab === 'lists') {
        listsView.style.display = 'block';
        fetchUserRatesList('watching');
      } else if (tab === 'history') {
        catalogView.style.display = 'block';
        document.getElementById('sectionTitle').textContent = 'История просмотра';
        renderGrid(state.history, 'animeGrid');
      } else {
        catalogView.style.display = 'block';
        document.getElementById('sectionTitle').textContent = 'Каталог аниме';
        renderGrid(state.animes, 'animeGrid');
      }
    }
  </script>
